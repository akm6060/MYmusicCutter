name: Build MYmusic Cutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # iPad-friendly: if the project was uploaded as a single .zip file, unpack it first.
      - name: Unpack uploaded project ZIP (if any)
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unpacking $z"
            unzip -o -q "$z"
          done
          test -f settings.gradle || { echo "settings.gradle not found: upload the project ZIP or its files to the repository root."; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Keep the build log when the build fails
        if: failure()
        run: |
          mkdir -p /tmp/logout && cp build.log /tmp/logout/build.log || echo "no log" > /tmp/logout/build.log
          cd /tmp/logout && git init -q && git checkout -q -b buildlog
          git add build.log
          git -c user.name=apk-bot -c user.email=apk-bot@users.noreply.github.com commit -q -m "build log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" buildlog

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYmusic-Cutter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to the "apk" branch (direct download link)
        run: |
          mkdir -p /tmp/apkout && cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/MYmusicCutter.apk
          cd /tmp/apkout && git init -q && git checkout -q -b apk
          git add MYmusicCutter.apk
          git -c user.name=apk-bot -c user.email=apk-bot@users.noreply.github.com commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
