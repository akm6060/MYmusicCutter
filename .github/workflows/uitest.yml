name: UI test on emulator

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  uitest:
    if: contains(github.event.head_commit.message, '[uitest]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Test video and tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 40 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/t.mp4
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=330:duration=125" -f lavfi -i "anullsrc=r=44100:cl=mono" -f lavfi -i "sine=frequency=550:duration=125" -f lavfi -i "sine=frequency=770:duration=125" -filter_complex "[1]atrim=0:4[s1];[1]atrim=0:4[s2];[0][s1][2][s2][3]concat=n=5:v=0:a=1" -c:a aac -b:a 96k -f adts /tmp/cassette.aac
          ls -l /tmp/cassette.aac
          ffmpeg -loglevel error -f lavfi -i "nullsrc=s=1600x1600,geq=random(1)*255:128:128" -frames:v 1 -q:v 1 /tmp/cover.jpg
          for i in 1 2 3; do ffmpeg -loglevel error -f lavfi -i "sine=frequency=$((330+i*110)):duration=130" -f lavfi -i "anullsrc=r=44100:cl=mono" -i /tmp/cover.jpg -filter_complex "[1]atrim=0:5[s];[0][s]concat=n=2:v=0:a=1[a]" -map "[a]" -map 2 -ar $((i==2 ? 48000 : 44100)) -c:a libmp3lame -b:a 128k -c:v copy -id3v2_version 3 -metadata title="Song $i" -disposition:v attached_pic /tmp/song$i.mp3; done
          cat /tmp/song1.mp3 /tmp/song2.mp3 /tmp/song3.mp3 > /tmp/album.mp3; ls -l /tmp/song*.mp3 /tmp/album.mp3
          for i in 1 2 3; do ffmpeg -loglevel error -f lavfi -i "sine=frequency=$((300+i*120)):duration=125" -f lavfi -i "anullsrc=r=44100:cl=stereo" -filter_complex "[1]atrim=0:5[s];[0]aformat=channel_layouts=stereo[t];[t][s]concat=n=2:v=0:a=1" -ar 44100 -f wav /tmp/yt$i.wav; done
          ffmpeg -loglevel error -i /tmp/yt1.wav -i /tmp/yt2.wav -i /tmp/yt3.wav -filter_complex "[0][1][2]concat=n=3:v=0:a=1" -c:a aac -b:a 128k -f mp4 /tmp/ytm4a.mp3
          ffmpeg -loglevel error -i /tmp/yt1.wav -i /tmp/yt2.wav -i /tmp/yt3.wav -filter_complex "[0][1][2]concat=n=3:v=0:a=1" -ar 48000 -c:a libopus -b:a 128k -f webm /tmp/ytwebm.mp3
          ls -l /tmp/ytm4a.mp3 /tmp/ytwebm.mp3; head -c 12 /tmp/ytm4a.mp3 | od -c | head -1
          pip install websocket-client
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: ./ci/uitest.sh
      - name: Publish results to the "uitest" branch
        if: always()
        run: |
          mkdir -p /tmp/uitest && cd /tmp/uitest && git init -q && git checkout -q -b uitest
          git add -A
          git -c user.name=apk-bot -c user.email=apk-bot@users.noreply.github.com commit -q -m "uitest ${GITHUB_SHA::7}" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" uitest
